name: Nightly Chaos Tests

on:
  # The deterministic suite is hermetic (no cloud credentials), so it can and
  # must run unattended — a dispatch-only "Nightly" workflow never runs.
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      chaos_seed:
        description: 'Seed for deterministic chaos (reserved for future suites)'
        required: false
        type: string
      chaos_duration_minutes:
        description: 'Duration for future chaos suites'
        required: false
        default: '30'
        type: string

permissions:
  contents: read

jobs:
  deterministic-orchestration:
    name: Deterministic orchestration coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          toolchain: 1.88

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2

      # Required, not optional: arco-flow depends on arco-proto, whose build.rs
      # invokes compile_protos() and therefore needs a system protoc. Without
      # this step the job fails in the build script before a single test runs.
      # Every Rust job in ci.yml installs it the same way.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Run deterministic orchestration coverage
        id: coverage
        run: cargo test -p arco-flow --test orchestration_correctness_tests

      # always(), so a failing suite still leaves an explanation in the job
      # summary instead of an empty one.
      - name: Report chaos status
        if: always()
        env:
          SUITE_OUTCOME: ${{ steps.coverage.outcome }}
        run: |
          {
            echo "## Nightly chaos status"
            echo ""
            echo "Deterministic orchestration coverage: \`${SUITE_OUTCOME:-not run}\`."
            echo ""
            echo "This workflow runs nightly (and on manual dispatch) and covers the deterministic multi-instance and clock-skew orchestration suites."
            echo "Full randomized chaos remains opt-in until stable backing suites and Cargo features exist."
          } >> "$GITHUB_STEP_SUMMARY"
