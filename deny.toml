# deny.toml - cargo-deny configuration for supply chain security
# https://embarkstudios.github.io/cargo-deny/
#
# Run with: cargo deny check
# Version: cargo-deny 0.18+

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# In cargo-deny 0.18+, all advisories are denied by default.
# Use "workspace" to only fail on direct workspace dependencies.
unmaintained = "workspace"
# Advisory exceptions are granted, never permanent. Each entry must carry a
# tracking issue, granted date, and review-by date. CI enforces the shape and
# the scheduled audit enforces expiry; see docs/runbooks/advisory-exceptions.md.
ignore = [
    { id = "RUSTSEC-2026-0194", reason = "quadratic duplicate-attribute check in quick-xml <0.41. XML responses from operator-configured authenticated storage endpoints, including R2, reach the parser. A hostile provider remains a denial-of-service risk. Fresh lockfile probes are blocked by quick-xml ^0.37 in object_store 0.11.2 and ^0.38 in opendal 0.55.0. Remove when both accept >=0.41. tracking #327, granted 2026-11-24, review-by 2026-12-24" },
    { id = "RUSTSEC-2026-0195", reason = "unbounded namespace allocation in quick-xml <0.41. XML responses from operator-configured authenticated storage endpoints reach the parser. A hostile provider remains a denial-of-service risk. Fresh lockfile probes are blocked by quick-xml ^0.37 in object_store 0.11.2 and ^0.38 in opendal 0.55.0. Remove when both accept >=0.41. tracking #327, granted 2026-11-24, review-by 2026-12-24" },
    { id = "RUSTSEC-2026-0543", reason = "Chrono maintenance notice with no patched version. Arco directly uses Chrono for RFC 3339 parsing, timestamp serialization and scheduling. Remove when the workspace uses a maintained time dependency or RustSec recognizes a maintained Chrono release. tracking #465, granted 2026-11-24, review-by 2026-12-24" },
    { id = "RUSTSEC-2026-0555", reason = "Chrono TZ maintenance notice with no patched version. Arco directly uses Chrono TZ to validate time zone inputs and evaluate schedules with IANA data. Remove when those paths use a maintained time zone dependency or RustSec recognizes a maintained Chrono TZ release. tracking #465, granted 2026-11-24, review-by 2026-12-24" },
]

[licenses]
# All licenses not in 'allow' are denied by default (cargo-deny 0.18+)
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "OpenSSL",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
]
confidence-threshold = 0.93
exceptions = [
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
    # Existing Iceberg credential dependency; keep CC0 scoped to the reviewed release.
    { allow = ["CC0-1.0"], crate = "tiny-keccak@2.0.2" },
]

# Workspace crates are private (not published) - exempt from license checks
[licenses.private]
ignore = true
registries = []

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
# Allow wildcards for workspace path dependencies (standard for monorepos)
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
