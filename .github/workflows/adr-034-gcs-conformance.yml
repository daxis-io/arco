name: ADR-034 GCS Conformance

# This workflow fails loudly instead of skipping green when its configuration
# is missing (#366): a green run must mean the CAS gate actually executed.
# Until the configuration below is provisioned, that means a red run every
# night — intentional, but only useful if someone owns provisioning it. Whoever
# is on that hook should either configure the workflow or, if GCS conformance
# is not being certified right now, drop the `schedule:` trigger and run it on
# dispatch, the way s3-conformance.yml does.
#
# HOW TO CONFIGURE
#
#   vars.ARCO_TEST_GCS_BUCKET  — a dedicated, disposable test bucket. Required
#                                for both auth modes.
#
#   Then EITHER (preferred, keyless):
#     vars.GCP_WORKLOAD_IDENTITY_PROVIDER — full resource name of the workload
#         identity pool provider, e.g.
#         projects/<num>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
#     vars.GCP_SERVICE_ACCOUNT            — the service account email the
#         provider is allowed to impersonate
#     The pool provider must trust this repository, and the service account
#     needs object read/write/delete on the bucket only. `id-token: write` is
#     already granted below.
#
#   OR (fallback, long-lived credential):
#     secrets.GCP_SA_KEY_API — JSON service-account key with the same bucket
#         scope. Retained only for environments without workload identity.

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  gcs-conformance:
    name: GCS Storage Conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          toolchain: 1.88
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          cache-targets: "false"

      # Secrets and vars are passed through env: rather than interpolated into
      # the script text, so their values never appear in the generated shell
      # command.
      - name: Check GCS conformance prerequisites
        id: prereq
        env:
          BUCKET: ${{ vars.ARCO_TEST_GCS_BUCKET }}
          WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          SA_KEY: ${{ secrets.GCP_SA_KEY_API }}
        run: |
          if [ -n "$BUCKET" ] && [ -n "$WORKLOAD_IDENTITY_PROVIDER" ] && [ -n "$SERVICE_ACCOUNT" ]; then
            echo "auth_mode=oidc" >> "$GITHUB_OUTPUT"
          elif [ -n "$BUCKET" ] && [ -n "$SA_KEY" ]; then
            echo "auth_mode=key" >> "$GITHUB_OUTPUT"
          else
            echo "auth_mode=skip" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to GCP via OIDC
        if: steps.prereq.outputs.auth_mode == 'oidc'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Authenticate to GCP via service-account key
        if: steps.prereq.outputs.auth_mode == 'key'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_API }}

      - name: Run GCS storage conformance suite
        if: steps.prereq.outputs.auth_mode != 'skip'
        env:
          ARCO_TEST_GCS_BUCKET: ${{ vars.ARCO_TEST_GCS_BUCKET }}
        run: |
          cargo test --locked -p arco-core --test storage_backend_conformance \
            gcs_backend_satisfies_storage_conformance -- --ignored --nocapture

      # This workflow only runs on schedule and workflow_dispatch; on both
      # triggers a missing configuration is an evidence-integrity failure, not
      # a skip (#366). A green run must mean the CAS gate actually executed.
      - name: Fail on missing GCS conformance configuration
        if: steps.prereq.outputs.auth_mode == 'skip'
        run: |
          {
            echo "## ADR-034 GCS conformance: FAILED (unconfigured)"
            echo ""
            echo "GCS conformance cannot run: secrets unconfigured — the provider CAS gate is UNVERIFIED."
            echo ""
            echo "Configure \`vars.ARCO_TEST_GCS_BUCKET\` plus either"
            echo "(\`vars.GCP_WORKLOAD_IDENTITY_PROVIDER\` + \`vars.GCP_SERVICE_ACCOUNT\`) or \`secrets.GCP_SA_KEY_API\`."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::GCS conformance cannot run: secrets unconfigured — the provider CAS gate is UNVERIFIED"
          exit 1
