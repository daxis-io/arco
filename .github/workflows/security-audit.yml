name: Security Audit

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_NET_RETRY: 5
  CARGO_HTTP_TIMEOUT: 60
  UV_VERSION: "0.11.15"
  PIP_AUDIT_VERSION: "2.10.0"

jobs:
  cargo-deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          toolchain: 1.88
      - name: Install cargo-deny
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2
        with:
          tool: cargo-deny@0.18.9
      - name: cargo-deny advisories
        run: cargo deny check advisories --hide-inclusion-graph
      - name: Advisory exceptions are tracked and unexpired
        run: python3 .github/scripts/check_advisory_exceptions.py --check-expiry
      - name: cargo-deny policy
        run: cargo deny check bans licenses sources --hide-inclusion-graph

  python-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project:
          - python
          - python/arco
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install audit tooling
        run: |
          python -m pip install --upgrade pip --retries 5
          python -m pip install --retries 5 "uv==${UV_VERSION}"
        working-directory: ${{ matrix.project }}
      - name: Install project dependencies
        run: uv sync --locked --extra dev
        working-directory: ${{ matrix.project }}
      - name: Run pip-audit
        run: uv run --locked --extra dev --with "pip-audit==${PIP_AUDIT_VERSION}" pip-audit
        working-directory: ${{ matrix.project }}

  audit-status:
    name: Security Audit Status
    if: ${{ always() }}
    needs:
      - cargo-deny
      - python-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Publish consolidated security audit status
        env:
          CARGO_DENY_RESULT: ${{ needs.cargo-deny.result }}
          PYTHON_AUDIT_RESULT: ${{ needs.python-audit.result }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "## Security Audit Status"
            echo
            echo "- cargo-deny: ${CARGO_DENY_RESULT}"
            echo "- python-audit: ${PYTHON_AUDIT_RESULT}"
            echo "- run: ${RUN_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$CARGO_DENY_RESULT" != "success" ] || [ "$PYTHON_AUDIT_RESULT" != "success" ]; then
            echo "::error title=Security Audit failed::cargo-deny=${CARGO_DENY_RESULT}, python-audit=${PYTHON_AUDIT_RESULT}; ${RUN_URL}"
            exit 1
          fi
