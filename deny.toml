# deny.toml - cargo-deny configuration for supply chain security
# https://embarkstudios.github.io/cargo-deny/
#
# Run with: cargo deny check
# Version: cargo-deny 0.18+

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# In cargo-deny 0.18+, all advisories are denied by default.
# Use "workspace" to only fail on direct workspace dependencies.
unmaintained = "workspace"
# Advisory exceptions are granted, never permanent. Each entry must carry a
# tracking issue, granted date, and review-by date. CI enforces the shape and
# the scheduled audit enforces expiry; see docs/runbooks/advisory-exceptions.md.
ignore = [
    { id = "RUSTSEC-2026-0194", reason = "quadratic duplicate-attribute check in quick-xml <0.41; reachable through authenticated object-store response XML, not direct end-user input; frozen object_store/DataFusion constraints block the patched line; tracking #327; granted 2026-07-05; review-by 2026-10-31" },
    { id = "RUSTSEC-2026-0195", reason = "unbounded namespace allocation in quick-xml <0.41; same authenticated object-store response boundary and frozen upstream constraint; tracking #327; granted 2026-07-05; review-by 2026-10-31" },
]

[licenses]
# All licenses not in 'allow' are denied by default (cargo-deny 0.18+)
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "OpenSSL",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
]
confidence-threshold = 0.93
exceptions = [
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
]

# Workspace crates are private (not published) - exempt from license checks
[licenses.private]
ignore = true
registries = []

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
# Allow wildcards for workspace path dependencies (standard for monorepos)
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
