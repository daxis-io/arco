# deny.toml - cargo-deny configuration for supply chain security
# https://embarkstudios.github.io/cargo-deny/
#
# Run with: cargo deny check
# Version: cargo-deny 0.18+

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# In cargo-deny 0.18+, all advisories are denied by default.
# Use "workspace" to only fail on direct workspace dependencies.
unmaintained = "workspace"
ignore = [
    # quick-xml is pulled through object_store 0.11.x (requires ^0.37) and
    # opendal 0.54.x via iceberg 0.6 (requires ^0.38). Both upstream constraints
    # block the fixed quick-xml >=0.41.0 (verified 2026-07-30:
    # `cargo update quick-xml@... --precise 0.41.0 --dry-run` fails on both);
    # resolving requires a broad DataFusion/Iceberg/object-store major upgrade.
    # Tracking: #327. Review/expiry: 2026-09-30 — re-check upstream releases and
    # remove or re-justify these suppressions by that date.
    # Rationale: quadratic run time checking start tags for duplicate attribute names (DoS-class, fixed in 0.41.0).
    "RUSTSEC-2026-0194",
    # Rationale: unbounded namespace-declaration allocation in NsReader enables memory-exhaustion DoS (fixed in 0.41.0).
    "RUSTSEC-2026-0195",
]

[licenses]
# All licenses not in 'allow' are denied by default (cargo-deny 0.18+)
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "OpenSSL",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
]
confidence-threshold = 0.93
exceptions = [
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
]

# Workspace crates are private (not published) - exempt from license checks
[licenses.private]
ignore = true
registries = []

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
# Allow wildcards for workspace path dependencies (standard for monorepos)
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
