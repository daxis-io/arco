name: S3 Storage Conformance

# Evidence-integrity companion to adr-034-gcs-conformance.yml (#366).
#
# ObjectStoreBackend::s3 exists in crates/arco-core/src/storage.rs, but the
# only test that exercises the CAS/precondition contract against real S3
# (s3_backend_satisfies_storage_conformance) is #[ignore]d and, before this
# workflow, had no runner anywhere. Until this workflow passes against a real
# bucket, the S3 provider is NOT certified for production use.
#
# TRIGGER POLICY: dispatch-only, deliberately. A missing configuration here is
# a loud failure and never a green skip — but no AWS bucket or credentials are
# provisioned yet, so a nightly cron would fail every night by design, for a
# reason nobody can act on tonight. That is exactly the alert fatigue this
# branch exists to remove: a scheduled job that is always red teaches everyone
# to ignore scheduled jobs, including the GCS one next to it that is genuinely
# actionable. Run it on demand to prove the gate, and add a `schedule:` block
# here in the same change that provisions the configuration below.
#
# HOW TO CONFIGURE (also required to flip this workflow to a schedule):
#   vars.ARCO_TEST_S3_BUCKET      — a dedicated, disposable test bucket
#   vars.AWS_REGION               — that bucket's region
#   secrets.AWS_ACCESS_KEY_ID     — static key for a principal scoped to it
#   secrets.AWS_SECRET_ACCESS_KEY — the matching secret
# The principal needs object read/write/delete plus conditional-write support
# on that bucket only. Prefer replacing the static keys with AWS OIDC role
# assumption when that infrastructure exists (see the note above the
# prerequisite step).

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  s3-conformance:
    name: S3 Storage Conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          toolchain: 1.88
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          cache-targets: "false"

      # Static-key auth only for now: AmazonS3Builder::from_env reads the AWS_*
      # environment variables directly, so no third-party credentials action is
      # required. When AWS OIDC infra exists, add a role-assumption mode here
      # mirroring the GCS workflow's workload-identity path.
      # Secrets and vars are passed through env: rather than interpolated into
      # the script text, so their values never appear in the generated shell
      # command.
      - name: Check S3 conformance prerequisites
        id: prereq
        env:
          BUCKET: ${{ vars.ARCO_TEST_S3_BUCKET }}
          REGION: ${{ vars.AWS_REGION }}
          ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -n "$BUCKET" ] && [ -n "$ACCESS_KEY_ID" ] && [ -n "$SECRET_ACCESS_KEY" ] && [ -n "$REGION" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run S3 storage conformance suite
        if: steps.prereq.outputs.configured == 'true'
        env:
          ARCO_TEST_S3_BUCKET: ${{ vars.ARCO_TEST_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          cargo test --locked -p arco-core --test storage_backend_conformance \
            s3_backend_satisfies_storage_conformance -- --ignored --nocapture

      - name: Fail on missing S3 conformance configuration
        if: steps.prereq.outputs.configured != 'true'
        run: |
          {
            echo "## S3 conformance: FAILED (unconfigured)"
            echo ""
            echo "S3 conformance cannot run: AWS credentials/bucket unconfigured — the provider CAS gate is UNVERIFIED."
            echo "**S3 is NOT certified**: no CAS conformance evidence exists for this provider."
            echo ""
            echo "Configure \`vars.ARCO_TEST_S3_BUCKET\`, \`vars.AWS_REGION\`,"
            echo "\`secrets.AWS_ACCESS_KEY_ID\`, and \`secrets.AWS_SECRET_ACCESS_KEY\`."
            echo ""
            echo "This workflow is \`workflow_dispatch\`-only until that configuration exists;"
            echo "add a \`schedule:\` trigger in the same change that provisions it, so the"
            echo "nightly signal starts out actionable instead of red by design."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::S3 conformance cannot run: AWS credentials/bucket unconfigured — the provider CAS gate is UNVERIFIED and S3 is NOT certified"
          exit 1
